services:
  postgres:
    image: postgres:16-alpine
    container_name: smartonboard-postgres
    environment:
      POSTGRES_USER: smartonboard
      POSTGRES_PASSWORD: smartonboard
      POSTGRES_DB: smartonboard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartonboard -d smartonboard"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
